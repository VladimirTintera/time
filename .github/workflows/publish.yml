name: Publish Release to Maven Central

on:
  push:
    tags:
      - 'v*' # Spustí se při pushnutí tagu (např. v1.0.2)
  workflow_dispatch: # Umožňuje ruční spuštění

jobs:
  publish:
    name: Build, Sign and Package Release
    runs-on: macos-latest
    if: github.repository == 'VladimirTintera/time'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Získání čisté verze z tagu (odstraní počáteční 'v')
      - name: Extract version from tag
        id: get_version
        run: |
          # Pokud je spuštěno tagem, ořízne 'v', jinak použije fallback
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Spuštění verifikačních testů
      - name: Run verification tests
        run: ./gradlew check

      # Jeden společný krok pro publish do lokálu i na vzdálený server
      # Opraveny názvy ENV proměnných, aby přesně odpovídaly tvé logice v Gradle
      - name: Publish to Local and Maven Central
        run: |
          ./gradlew publishAllPublicationsToLocalRepoRepository publishAllPublicationsToMavenCentralRepository -Pversion=${{ steps.get_version.outputs.version }}
        env:
          MAVENCENTRALUSERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRALPASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      # Zabalení lokálního repozitáře do ZIPu pro zálohu
      - name: Package Artifacts into ZIP
        run: |
          cd build/local-repo
          zip -r ../local-repo-release.zip .
          cd ../..

      # Upload ZIPu do GitHub Artifacts
      - name: Upload Release ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-repo-release-${{ steps.get_version.outputs.version }}
          path: build/local-repo-release.zip